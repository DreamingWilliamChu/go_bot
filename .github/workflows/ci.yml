name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      # Engine and moku tests skip themselves when KataGo / weights are absent; see the jobs below.
      - run: uv run pytest -q

  variant-training:
    name: Bonus-turn network training (CPU smoke run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # torch comes from the CPU-only index on Linux (pyproject [tool.uv.sources])
      - run: uv sync --frozen --group train
      - run: uv run pytest -q tests/variant
      - run: GOBOT_VARIANT_DIR=$RUNNER_TEMP/variant uv run gobot variant pipeline run --preset smoke_cpu --no-katago --run ci
      - run: cat $RUNNER_TEMP/variant/runs/ci/eval/report.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend typecheck, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  katago:
    name: Real KataGo integration (Eigen CPU build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: |
            data/katago-linux
            models/*.bin.gz
          key: katago-${{ hashFiles('models/manifest.json', 'scripts/fetch_ci_engine.sh') }}
      - run: ./scripts/fetch_ci_engine.sh b18c384-conv tf2-b10c384
      - run: uv run pytest -q tests/test_katago_real.py tests/test_api.py tests/test_engine_failures.py

  recognition:
    name: Photo recognition evaluation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: |
            models/moku-v4.onnx
            data/testsets
          key: recog-${{ hashFiles('models/manifest.json', 'scripts/fetch_test_data.sh') }}
      - run: uv run gobot models download moku-v4
      - run: ./scripts/fetch_test_data.sh tengen moku
      - run: uv run pytest -q tests/test_vision.py
      - run: uv run gobot eval --sets tengen moku-v3-test synthetic
      - run: cat data/eval/recognition.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: recognition-report
          path: data/eval

  e2e:
    name: End-to-end (Playwright, phone and desktop viewports)
    runs-on: ubuntu-24.04
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/cache@v4
        with:
          path: |
            data/katago-linux
            models/*.bin.gz
          key: katago-${{ hashFiles('models/manifest.json', 'scripts/fetch_ci_engine.sh') }}
      - run: ./scripts/fetch_ci_engine.sh b18c384-conv tf2-b10c384
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run e2e -- --project=iphone-13 --project=iphone-se --project=desktop
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
