[project]
name = "gobot"
version = "0.1.0"
description = "Local Go/围棋 board photo recognition and KataGo analysis server"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "onnxruntime>=1.18",
    "segno>=1.6",
    "cryptography>=42",
    "psutil>=5.9",
]

[project.scripts]
gobot = "gobot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyarrow>=16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "katago: requires a real KataGo binary and model (set GOBOT_KATAGO_BIN / models present)",
    "slow: long-running test",
    "dataset: requires downloaded evaluation datasets in data/testsets",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
